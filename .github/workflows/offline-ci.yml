name: Project 17 Offline Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: offline-${{ matrix.os }}-py311
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Full pytest suite
        run: python -m pytest -o addopts='' -q
      - name: Source tree and actual Git index audit
        run: python -m product_analytics.audit.cp4_audit --git-index --out artifacts/cp4/ci_audit.json
      - name: Reproduce compact synthetic smoke cases
        run: |
          python -m product_analytics.data.cp1_report --scenario baseline --users 50 --seed 42 --out-dir artifacts/ci_cp1
          python -m product_analytics.data.cp2_report --scenario baseline --users 50 --seed 42 --out-dir artifacts/ci_cp2
          python -m product_analytics.data.cp3_report --scenario underpowered --users 60 --seed 1706 --out-dir artifacts/ci_cp3
